name: Release

# Builds, signs, notarizes, and publishes a DMG when a version tag is pushed.
#
# Requires these repository secrets to actually sign/notarize/auto-update
# (see issue #8):
#   MACOS_CERTIFICATE          - base64-encoded Developer ID Application .p12
#   MACOS_CERTIFICATE_PASSWORD - password for the .p12
#   MACOS_CERTIFICATE_IDENTITY - signing identity, e.g.
#                                 "Developer ID Application: Name (TEAMID)"
#   APPLE_ID                   - Apple ID used for notarization
#   APPLE_APP_PASSWORD         - app-specific password for that Apple ID
#   APPLE_TEAM_ID               - Apple Developer Team ID
#   SPARKLE_PUBLIC_ED_KEY       - public half of a keypair from Sparkle's
#                                 `generate_keys` tool; baked into the app's
#                                 Info.plist (SUPublicEDKey) so it can verify
#                                 update signatures
#   SPARKLE_PRIVATE_ED_KEY      - private half of that same keypair; used
#                                 only in this workflow to sign the appcast,
#                                 never shipped in the app
#
# Without these secrets, scripts/package-dmg.sh still runs (ad-hoc signed,
# not notarized), and the appcast step is skipped — the app ships with
# auto-update disabled (see UpdaterService.swift) rather than a broken one.
# This workflow has not been run against real secrets yet.
#
# The Sparkle SPM package only vends the Sparkle.framework binary for
# linking — generate_keys/generate_appcast/sign_update aren't part of it.
# They come from Sparkle's own release distribution, installed here via
# Homebrew.

on:
  push:
    tags:
      - "v*"

jobs:
  build-and-release:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Derive version from tag
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          echo "version=$TAG" >> "$GITHUB_OUTPUT"

      - name: Import signing certificate
        if: ${{ secrets.MACOS_CERTIFICATE != '' }}
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          CERT_PATH="$RUNNER_TEMP/certificate.p12"

          echo -n "$MACOS_CERTIFICATE" | base64 --decode -o "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$MACOS_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain

      - name: Build, sign, and package DMG
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}
          CODESIGN_IDENTITY: ${{ secrets.MACOS_CERTIFICATE_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          SPARKLE_PUBLIC_ED_KEY: ${{ secrets.SPARKLE_PUBLIC_ED_KEY }}
        run: ./scripts/package-dmg.sh

      - name: Generate signed appcast
        if: ${{ secrets.SPARKLE_PRIVATE_ED_KEY != '' }}
        env:
          SPARKLE_PRIVATE_ED_KEY: ${{ secrets.SPARKLE_PRIVATE_ED_KEY }}
        run: |
          brew install --cask sparkle
          KEY_PATH="$RUNNER_TEMP/sparkle_ed_private_key"
          echo -n "$SPARKLE_PRIVATE_ED_KEY" > "$KEY_PATH"
          /usr/local/Caskroom/sparkle/*/bin/generate_appcast \
            --ed-key-file "$KEY_PATH" \
            --download-url-prefix "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/" \
            dist/

      - name: Upload DMG (and appcast, if generated) to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/EarlySync-*.dmg
            dist/appcast.xml
